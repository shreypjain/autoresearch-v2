[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoresearch-v2"
version = "0.1.0"
description = "Forkable agentic ML experiment harness with frozen evaluation boundaries."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "InquirerPy>=0.3.4",
  "jsonschema>=4.21",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "rich>=13.7",
  "scikit-learn>=1.4",
  "textual>=0.89",
  "typer>=0.12",
]

[project.optional-dependencies]
deep = [
  "torch>=2.2",
]

[project.scripts]
autoresearch = "autoresearch.cli:app"
new-experiment = "autoresearch.new_experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
