[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoresearch-v2"
version = "0.1.0"
description = "Forkable agentic ML experiment harness with frozen evaluation boundaries."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.21",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
deep = [
  "torch>=2.2",
]

[project.scripts]
autoresearch-bootstrap = "autoresearch.bootstrap:main"
autoresearch-evaluate = "autoresearch.evaluator:main"
autoresearch-index = "autoresearch.readme_index:main"
autoresearch-new-experiment = "autoresearch.new_experiment:main"
autoresearch-prepare-data = "autoresearch.prepare_data:main"
autoresearch-verify-freeze = "autoresearch.verify_freeze:main"
new-experiment = "autoresearch.new_experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
